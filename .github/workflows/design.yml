name: design

# Los colores y textos salen de design/tokens.json y el icono de tools/design/gen_logo.py: comprueba que Tokens.kt,
# tokens.h y los iconos generados están al día y que el texto se lee (contraste AA), y prueba que la ventana del PC
# enseña cada cosa donde debe (sin Windows).
on:
  push:
    paths: ['design/**', 'tools/design/**', 'android/app/src/main/kotlin/com/desklink/ui/Tokens.kt', 'android/app/src/main/res/drawable/**', 'windows/app/**', '.github/workflows/design.yml']
  pull_request:
    paths: ['design/**', 'tools/design/**', 'android/app/src/main/kotlin/com/desklink/ui/Tokens.kt', 'android/app/src/main/res/drawable/**', 'windows/app/**', '.github/workflows/design.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Colores generados al día y contraste
        run: python3 tools/design/gen_tokens.py --check
      - name: Icono generado al día
        run: python3 tools/design/gen_logo.py --check
      - name: Pruebas de la ventana del PC
        run: |
          cmake -S windows/app -B build/app
          cmake --build build/app
          ctest --test-dir build/app --output-on-failure
