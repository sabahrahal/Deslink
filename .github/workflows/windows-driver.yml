name: windows-driver

on:
  push:
    paths: ['windows/driver/**', '.github/workflows/windows-driver.yml', '.github/scripts/package-driver.ps1']
  pull_request:
    paths: ['windows/driver/**', '.github/workflows/windows-driver.yml', '.github/scripts/package-driver.ps1']

jobs:
  build:
    # windows-2022 trae el WDK (Windows Driver Kit) instalado; windows-2025 no.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Compilar el driver
        run: msbuild windows/driver/idd/desklink-idd.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Compilar el instalador
        run: |
          cmake -S windows/driver/setup -B build/setup -A x64
          cmake --build build/setup --config Release

      - name: Empaquetar y firmar
        shell: pwsh
        run: .github/scripts/package-driver.ps1 -Out pkg

      - uses: actions/upload-artifact@v4
        with:
          name: extendesk-driver-windows
          path: pkg/
