name: landing

# Compila la landing (landing/, Astro) y, en cada cambio en main, la publica en GitHub Pages:
#   https://sabahrahal.github.io/deslink/
# Una sola vez: Settings → Pages → Source: «GitHub Actions».

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**', '.github/workflows/landing.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: landing/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
